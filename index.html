<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parte de Guardia</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guardia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#215732">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ED8B00'/%3E%3Cstop offset='1' stop-color='%23ED8B00' stop-opacity='0.55'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%23215732'/%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='18' fill='%230a0c10'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#215732; --header:#215732; --orange:#ED8B00; --orange-ink:#1d1200;
  --bg:#f2f4f0; --surface:#ffffff; --surface-2:#f6f7f4; --border:#dce1d9;
  --text:#1f2421; --muted:#667068; --accent:#215732;
  --ok:#2e7d46; --ok-soft:rgba(46,125,70,.12); --ko:#c0392b; --ko-soft:rgba(192,57,43,.10);
  --warn-soft:rgba(237,139,0,.14);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(20,40,25,.05);
  --radius:16px; --head:'Jost',-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --header:#173f24; --bg:#0c120e; --surface:#141c17; --surface-2:#1a241e; --border:#27352c;
    --text:#e6ebe7; --muted:#8f9d93; --accent:#58b77a;
    --ok:#4caf6e; --ok-soft:rgba(76,175,110,.16); --ko:#ef6b5b; --ko-soft:rgba(239,107,91,.14);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --header:#173f24; --bg:#0c120e; --surface:#141c17; --surface-2:#1a241e; --border:#27352c;
  --text:#e6ebe7; --muted:#8f9d93; --accent:#58b77a;
  --ok:#4caf6e; --ok-soft:rgba(76,175,110,.16); --ko:#ef6b5b; --ko-soft:rgba(239,107,91,.14);
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);font-weight:600}

/* Topbar */
.topbar{position:sticky;top:0;z-index:20;background:var(--header);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 3px 0 var(--orange)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,#ED8B00 0%,rgba(237,139,0,.55) 100%);
  display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:15px;color:#0a0c10;
  box-shadow:0 0 24px rgba(237,139,0,.35)}
.brand-text{font-family:var(--head);font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-text .sub{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:9px;color:rgba(255,255,255,.7);
  text-transform:uppercase;letter-spacing:.2em;display:block;margin-top:1px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#9aa59d}
.pill.ok .dot{background:#6fdc8c}.pill.pend .dot{background:var(--orange)}.pill.off .dot{background:#ff7a6b}
.pill.busy .dot{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Layout */
main{max-width:560px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
.tab{display:none}.tab.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec-head{margin:2px 2px 14px}
.sec-head h2{font-family:var(--head);font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.lead{margin:2px 0 0;color:var(--muted);font-size:14px}
h3{font-family:var(--head);font-size:17px;margin:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.done{border-left:4px solid var(--ok)}
.card.done.ko{border-left-color:var(--ko)}
.veh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.veh-name{font-family:var(--head);font-size:19px;font-weight:700;line-height:1.2}
.plate{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.ko{background:var(--ko-soft);color:var(--ko)}
.badge.warn{background:var(--warn-soft);color:var(--orange)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;margin:12px 0 4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted);transition:background .15s}
.seg button.on-ok{background:var(--ok);color:#fff}.seg button.on-ko{background:var(--ko);color:#fff}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:block;margin-top:12px}
.field>span,.label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field em,.label em{font-style:normal;font-weight:400}
input,select,textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);-webkit-appearance:none;appearance:none}
input[type=date]{min-height:48px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:0;border-color:transparent}
input.invalid{border-color:var(--ko);background:var(--ko-soft)}
input:disabled{opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.stats small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stats b{font-family:var(--head);font-size:19px;font-variant-numeric:tabular-nums}
.stats b.neg{color:var(--ko)}
.obs{margin:10px 0 0;font-size:14px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:14px;
  background:var(--orange);color:var(--orange-ink);font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:.01em;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--border);font-size:16px;min-height:48px}
.btn.green{background:var(--green);color:#fff}
.btn.danger{background:transparent;color:var(--ko);border:1px solid var(--ko);font-size:15px;min-height:44px}
.btn.sm{min-height:40px;font-size:15px;width:auto;padding:0 14px}
.row-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row-btns .btn{flex:1}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0 0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);font-weight:600}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.list{padding:4px 14px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow small{display:block;color:var(--muted);font-size:13px}
.amount{font-family:var(--head);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.list-head{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.list-head span{font-family:var(--head);font-weight:700;color:var(--orange)}
.empty{text-align:center;padding:26px 16px}
.empty p{color:var(--muted);margin:6px 0 16px}
.note{padding:12px 14px;border-radius:12px;font-size:14px;margin:4px 0 12px}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--warn-soft);color:var(--text)}
.icon-btn{border:0;background:var(--surface-2);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.04em}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted);min-height:54px;border-radius:12px;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.active{color:var(--accent)}
.nav button.active::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:3px;background:var(--orange)}
.nav .count{position:absolute;top:4px;right:calc(50% - 22px);background:var(--orange);color:var(--orange-ink);font-size:10px;border-radius:999px;padding:1px 5px;font-weight:800}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;
  background:#1f2421;color:#fff;padding:13px 16px;border-radius:14px;font-size:15px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transform:translateY(20px);opacity:0;pointer-events:none;transition:all .22s}
.toast.show{transform:none;opacity:1}
.toast.ok{border-left:4px solid #6fdc8c}.toast.ko{border-left:4px solid #ff7a6b}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">G</div>
    <div class="brand-text">
      PARTE DE GUARDIA
      <span class="sub">Control de vehículos</span>
    </div>
  </div>
  <button class="pill" id="pill" data-act="go" data-tab="mas"><span class="dot"></span><span id="pill-txt">—</span></button>
</header>

<main>
  <section class="tab active" id="tab-inicio"></section>
  <section class="tab" id="tab-repostaje"></section>
  <section class="tab" id="tab-final"></section>
  <section class="tab" id="tab-mas"></section>
</main>

<nav class="nav">
  <button data-act="go" data-tab="inicio" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Inicio</button>
  <button data-act="go" data-tab="repostaje">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M7 8h4M14 10h2a2 2 0 0 1 2 2v4a1.5 1.5 0 0 0 3 0V8.5L18 5.5"/></svg>Repostaje</button>
  <button data-act="go" data-tab="final">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/></svg>Final</button>
  <button data-act="go" data-tab="mas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Más<span class="count" id="nav-count" hidden></span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
'use strict';
const VERSION = '20261015';
const PROMPT_ORIGINAL = `Quiero crear una app o html que pueda abrir directamente desde el movil, y tendra tres tabs. Una sera Inicio de guardia, en la que indico si el / los vehiculos que demos de alta esta operativo en parque y los km que tiene. La segun tab es al de repostaje, en la que indico el vehiculo repostado , importe y km en el momento del repostaje y la tercera tab es final de guardia que introduzco los km finales. Esto podria ser que al insertar los valores, haga una llamada a actualizar por ejemplo un documento .txt que tenga en mega, para mas tarde cuando actualizo el parte de guardia diario, tener el txt de consulta.

[Decisión] Opción 1: Google Sheets + Apps Script. HTML para abrir desde Safari con acceso directo en la pantalla de inicio. Colores del Consorcio de Bomberos de la Provincia de Sevilla (verde Pantone 357 + naranja Pantone 144).`;

const KEY = 'pg.state.v1', UKEY = 'pg.upgrades.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

const DEF = { config:{ vehiculos:[], url:'', token:'', parque:'' }, guardia:null, cola:[], historial:[], ultimoKm:{}, lastSync:null };
let S = Object.assign(JSON.parse(JSON.stringify(DEF)), load(KEY, {}));
S.config = Object.assign({}, DEF.config, S.config);
let UP = load(UKEY, []);
function persist(){ if(!store(KEY, S)) toast('No se pudo guardar en el móvil', 'ko'); }

const draft = { tab:'inicio', editInicio:{}, repVeh:null, masTab:'ajustes', ultimaCerrada:null };
let syncing = false, lastErr = '';

/* ---------- Formatos ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const ahora = () => { const d = new Date(); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hora = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fFecha = iso => { const [y, m, d] = String(iso).split('-'); const dt = new Date(+y, m - 1, +d);
  return dt.toLocaleDateString('es-ES', { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' }); };
const parseKm = v => { const d = String(v || '').replace(/\D/g, ''); return d ? parseInt(d, 10) : null; };
const parseDec = v => { let s = String(v || '').trim().replace(/\s|€/g, ''); if(!s) return null;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) / 100 : null; };
const fKm = n => n == null ? '—' : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fNum = n => n == null ? '—' : String(n).replace('.', ',');
const fEur = n => { const [e, d] = (Number(n) || 0).toFixed(2).split('.'); return e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d + ' €'; };

/* ---------- Datos ---------- */
const veh = id => S.config.vehiculos.find(v => v.id === id);
const vLabel = v => v.nombre + (v.matricula ? ` (${v.matricula})` : '');
const labelOf = id => { const v = veh(id); if(v) return vLabel(v); const i = S.guardia && S.guardia.inicio[id]; return i ? i.label : id; };
function kmRef(id, g = S.guardia){
  let m = null; const up = k => { if(k != null && (m == null || k > m)) m = k; };
  if(g){ g.inicio[id] && up(g.inicio[id].km); g.repostajes.filter(r => r.vid === id).forEach(r => up(r.km)); }
  if(m == null) up(S.ultimoKm[id]);
  return m;
}
function evento(tipo, label, extra, gid){
  S.cola.push(Object.assign({ uid:uid(), guardia:gid, tipo, vehiculo:label, fechaHora:ahora(),
    ts:new Date().toISOString(), parque:S.config.parque || '' }, extra));
}

/* ---------- Piezas UI ---------- */
const head = (t, s) => `<div class="sec-head"><h2>${t}</h2>${s ? `<p class="lead">${s}</p>` : ''}</div>`;
const badgeOp = op => `<span class="badge ${op ? 'ok' : 'ko'}">${op ? 'Operativo' : 'No operativo'}</span>`;
const vHead = (name, plate, right = '') => `<div class="veh-head"><div><div class="veh-name">${esc(name)}</div>${plate ? `<div class="plate">${esc(plate)}</div>` : ''}</div>${right}</div>`;
const emptyVeh = () => `<div class="card empty"><h3>Aún no hay vehículos</h3><p>Da de alta los vehículos del parque una sola vez.</p><button class="btn green" data-act="go" data-tab="mas">Añadir vehículos</button></div>`;
const needInicio = () => `<div class="card empty"><h3>No hay guardia abierta</h3><p>Registra primero el inicio de guardia.</p><button class="btn green" data-act="go" data-tab="inicio">Ir a Inicio</button></div>`;

/* ---------- INICIO ---------- */
function renderInicio(){
  const el = $('#tab-inicio'), vs = S.config.vehiculos, g = S.guardia;
  let h = head('Inicio de guardia', g ? `Guardia abierta · ${fFecha(g.id)}` : 'Estado de los vehículos en parque y km al relevo.');
  if(!vs.length){ el.innerHTML = h + emptyVeh(); return; }
  const n = g ? Object.keys(g.inicio).length : 0;
  h += `<div class="card"><label class="field" style="margin:0"><span>Fecha de la guardia</span>
        <input type="date" id="g-fecha" value="${g ? g.id : hoyISO()}" ${n ? 'disabled' : ''}></label>
        ${n ? '' : '<p class="hint">Si la guardia empezó ayer, cambia la fecha antes de registrar.</p>'}</div>`;
  let forms = 0;
  vs.forEach(v => {
    const r = g && g.inicio[v.id];
    if(r && !draft.editInicio[v.id]){
      h += `<div class="card done ${r.operativo ? '' : 'ko'}">${vHead(v.nombre, v.matricula, badgeOp(r.operativo))}
        <div class="stats"><div><small>Km inicio</small><b>${fKm(r.km)}</b></div><div><small>Registrado</small><b>${hora(r.ts)}</b></div></div>
        ${r.obs ? `<p class="obs">${esc(r.obs)}</p>` : ''}
        <button class="link" data-act="corr-ini" data-id="${v.id}">Corregir</button></div>`;
    } else {
      forms++;
      const op = r ? r.operativo : true, ult = S.ultimoKm[v.id];
      h += `<div class="card veh-form" data-id="${v.id}" data-op="${op ? 1 : 0}">${vHead(v.nombre, v.matricula, r ? '<span class="badge warn">Corrigiendo</span>' : '')}
        <div class="seg"><button type="button" data-act="op" data-v="1" class="${op ? 'on-ok' : ''}">Operativo</button><button type="button" data-act="op" data-v="0" class="${op ? '' : 'on-ko'}">No operativo</button></div>
        <label class="field"><span>Km actuales</span><input name="km" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${r && r.km != null ? r.km : ''}" placeholder="${ult != null ? 'Último: ' + fKm(ult) : 'Ej. 45120'}"></label>
        <label class="field"><span>Observaciones <em>(opcional)</em></span><input name="obs" autocomplete="off" value="${esc(r ? r.obs : '')}" placeholder="Avería, incidencia, nivel…"></label></div>`;
    }
  });
  if(forms) h += `<button class="btn" data-act="save-ini">${n ? 'Guardar' : 'Registrar inicio de guardia'}</button>`;
  else h += `<div class="note ok">✓ Inicio registrado. Siguiente: <a href="#" data-act="go" data-tab="repostaje">Repostaje</a> o <a href="#" data-act="go" data-tab="final">Final de guardia</a>.</div>`;
  el.innerHTML = h;
}
function saveInicio(){
  const rows = []; let err = 0;
  $$('#tab-inicio .veh-form').forEach(f => {
    const v = veh(f.dataset.id), op = f.dataset.op === '1', inp = $('[name=km]', f), km = parseKm(inp.value);
    const bad = op && km == null; inp.classList.toggle('invalid', bad); if(bad) err++;
    rows.push({ v, op, km, obs: $('[name=obs]', f).value.trim() });
  });
  if(err){ toast('Indica los km de los vehículos operativos', 'ko'); return; }
  const g0 = S.guardia;
  const bajos = rows.filter(r => !(g0 && g0.inicio[r.v.id]) && r.km != null && S.ultimoKm[r.v.id] != null && r.km < S.ultimoKm[r.v.id]);
  if(bajos.length && !confirm('Km menores que el último registrado:\n' + bajos.map(r => `${r.v.nombre}: ${fKm(r.km)} (último ${fKm(S.ultimoKm[r.v.id])})`).join('\n') + '\n\n¿Continuar?')) return;
  if(!S.guardia) S.guardia = { id: $('#g-fecha').value || hoyISO(), inicio:{}, repostajes:[], final:{} };
  const g = S.guardia;
  rows.forEach(r => {
    const corr = !!g.inicio[r.v.id], label = vLabel(r.v);
    g.inicio[r.v.id] = { operativo:r.op, km:r.km, obs:r.obs, ts:Date.now(), label };
    evento(corr ? 'INICIO (corrección)' : 'INICIO', label, { operativo:r.op, km:r.km, obs:r.obs }, g.id);
    if(r.km != null) S.ultimoKm[r.v.id] = r.km;
    delete draft.editInicio[r.v.id];
  });
  persist(); renderAll(); toast('Inicio de guardia registrado', 'ok'); sync();
}

function saveRepostaje(){
  const g = S.guardia, v = veh(draft.repVeh);
  if(!v){ toast('Elige el vehículo', 'ko'); return; }
  const iImp = $('#r-imp'), iKm = $('#r-km');
  const importe = parseDec(iImp.value), litros = parseDec($('#r-lit').value), km = parseKm(iKm.value), obs = $('#r-obs').value.trim();
  iImp.classList.toggle('invalid', !(importe > 0)); iKm.classList.toggle('invalid', km == null);
  if(!(importe > 0) || km == null){ toast('Faltan importe o km', 'ko'); return; }
  const ini = g.inicio[v.id] && g.inicio[v.id].km;
  if(ini != null && km < ini && !confirm(`Los km (${fKm(km)}) son menores que los de inicio (${fKm(ini)}). ¿Registrar igualmente?`)) return;
  const label = vLabel(v);
  g.repostajes.push({ uid:uid(), vid:v.id, label, importe, litros, km, obs, ts:Date.now() });
  evento('REPOSTAJE', label, { importe, litros, km, obs }, g.id);
  if(S.ultimoKm[v.id] == null || km > S.ultimoKm[v.id]) S.ultimoKm[v.id] = km;
  persist(); renderRepostaje(); renderFinal(); toast(`Repostaje de ${fEur(importe)} registrado`, 'ok'); sync();

/* ---------- FINAL ---------- */

  const el = $('#tab-final'), g = S.guardia;

  }

function updateRec(f){
  const ini = f.dataset.ini === '' ? null : +f.dataset.ini, km = parseKm($('[name=km]', f).value), b = $('.rec', f);
  if(ini == null || km == null){ b.textContent = '—'; b.classList.remove('neg'); return; }
  b.textContent = fKm(km - ini) + ' km'; b.classList.toggle('neg', km < ini);
}
function closeGuardia(){
  const g = S.guardia, rows = []; let err = 0;
  $$('#tab-final .fin-form').forEach(f => {
    const id = f.dataset.id, ini = f.dataset.ini === '' ? null : +f.dataset.ini, inp = $('[name=km]', f), km = parseKm(inp.value);
    const bad = (ini != null && km == null) || (ini != null && km != null && km < ini);
    inp.classList.toggle('invalid', bad); if(bad) err++;
    rows.push({ id, ini, km });
  });
  if(err){ toast('Revisa los km finales (vacíos o menores que los de inicio)', 'ko'); return; }
  if(!confirm(`¿Cerrar la guardia del ${fFecha(g.id)}?`)) return;
  rows.forEach(r => {
    const rec = r.km != null && r.ini != null ? r.km - r.ini : null;
    g.final[r.id] = { km:r.km, recorridos:rec, ts:Date.now() };
    evento('FINAL', g.inicio[r.id].label, { km:r.km, recorridos:rec }, g.id);
    if(r.km != null) S.ultimoKm[r.id] = r.km;
  });
  g.cerrada = Date.now();
  S.historial.unshift(g); S.historial = S.historial.slice(0, 30);
  draft.ultimaCerrada = g.id; S.guardia = null; draft.editInicio = {};
  persist(); renderAll(); toast('Guardia cerrada', 'ok'); sync();
}

/* ---------- TXT ---------- */
function buildTxt(g){
  const L = [], ids = Object.keys(g.inicio);
  L.push('PARTE DE GUARDIA · ' + fFecha(g.id));
  if(S.config.parque) L.push('Parque: ' + S.config.parque);
  L.push('Generado en el móvil: ' + ahora(), '============================================', '', 'INICIO DE GUARDIA');
  if(!ids.length) L.push('  (sin registros)');
  ids.forEach(id => { const i = g.inicio[id];
    L.push(`  ${i.label} · ${i.operativo ? 'Operativo' : 'NO OPERATIVO'} · Km ${fKm(i.km)} · ${hora(i.ts)}${i.obs ? ' · ' + i.obs : ''}`); });
  L.push('', 'REPOSTAJES');
  if(!g.repostajes.length) L.push('  (ninguno)');
  g.repostajes.forEach(r => L.push(`  ${hora(r.ts)} · ${r.label} · ${fEur(r.importe)}${r.litros != null ? ' · ' + fNum(r.litros) + ' L' : ''} · Km ${fKm(r.km)}${r.obs ? ' · ' + r.obs : ''}`));
  if(g.repostajes.length) L.push('  Total repostado: ' + fEur(g.repostajes.reduce((a, r) => a + r.importe, 0)));
  L.push('', 'FINAL DE GUARDIA');
  const fin = Object.keys(g.final || {});
  if(!fin.length) L.push('  (pendiente)');
  fin.forEach(id => { const f = g.final[id];
    L.push(`  ${g.inicio[id].label} · Km final ${fKm(f.km)}${f.recorridos != null ? ' · Recorridos ' + fKm(f.recorridos) + ' km' : ''} · ${hora(f.ts)}`); });
  return L.join('\n');
}
async function shareTxt(name, text){
  try{
    const file = new File([text], name, { type:'text/plain' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/plain;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- Estado / sync ---------- */
function renderStatus(){
  const p = $('#pill'), t = $('#pill-txt'), n = S.cola.length;
  p.className = 'pill';
  if(syncing){ p.classList.add('busy'); t.textContent = 'Enviando…'; }
  else if(!S.config.url){ t.textContent = 'Sin configurar'; }
  else if(n && !navigator.onLine){ p.classList.add('off'); t.textContent = `${n} sin conexión`; }
  else if(n){ p.classList.add('pend'); t.textContent = `${n} pendiente${n > 1 ? 's' : ''}`; }
  else { p.classList.add('ok'); t.textContent = 'Sincronizado'; }
  const c = $('#nav-count'); c.hidden = !n; c.textContent = n;
  const sc = $('#sync-card'); if(sc) sc.innerHTML = syncCardHTML();
}
async function sync(manual){
  const { url, token } = S.config;
  if(syncing) return;
  if(!S.cola.length){ if(manual) toast('No hay nada pendiente', 'ok'); renderStatus(); return; }
  if(!url){ if(manual) toast('Configura la URL en Más › Ajustes', 'ko'); renderStatus(); return; }
  if(!navigator.onLine){ if(manual) toast('Sin cobertura. Se enviará al recuperar conexión', 'ko'); renderStatus(); return; }
  syncing = true; renderStatus();
  const lote = S.cola.slice();
  try{
    const r = await fetch(url, { method:'POST', body:JSON.stringify({ token, events:lote }) });
    const j = await r.json();
    if(j.ok){
      const done = new Set(j.done || lote.map(e => e.uid));
      S.cola = S.cola.filter(e => !done.has(e.uid)); S.lastSync = Date.now(); lastErr = ''; persist();
      if(manual) toast('Enviado a Google Sheets', 'ok');
    } else { lastErr = j.error || 'Error del servidor'; if(manual) toast(lastErr, 'ko'); }
  }catch(e){
    lastErr = 'No se pudo contactar con Google. Queda pendiente.';
    if(manual) toast(lastErr, 'ko');
  }
  syncing = false; renderStatus();
}
async function testConn(){
  saveCfg(true);
  const { url, token } = S.config;
  if(!url){ toast('Pega primero la URL', 'ko'); return; }
  if(/\/dev(\?|$)/.test(url)){ toast('Usa la URL que termina en /exec, no /dev', 'ko'); return; }
  try{
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 'action=ping&token=' + encodeURIComponent(token));
    const j = await r.json();
    if(j.ok){ toast(`Conectado con «${j.hoja}»`, 'ok'); lastErr = ''; sync(); }
    else toast(j.error || 'Respuesta no válida', 'ko');
  }catch(e){ toast('No conecta. Revisa la URL y que el acceso sea "Cualquier usuario"', 'ko'); }
}
function saveCfg(silent){
  S.config.parque = $('#c-parque').value.trim();
  S.config.url = $('#c-url').value.trim();
  S.config.token = $('#c-token').value.trim();
  persist(); renderStatus(); if(!silent){ toast('Ajustes guardados', 'ok'); sync(); }
}

/* ---------- Navegación / eventos ---------- */
function go(tab){
  draft.tab = tab;
  $$('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + tab));
  $$('.nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  window.scrollTo(0, 0);
}
function renderAll(){ renderInicio(); renderRepostaje(); renderFinal(); renderMas(); renderStatus(); }
let tt;
function toast(msg, kind = ''){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(tt); tt = setTimeout(() => t.className = 'toast', 2800);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(b.tagName === 'A') e.preventDefault();
  switch(a){
    case 'go': go(b.dataset.tab); break;
    case 'op': { const f = b.closest('.veh-form'); f.dataset.op = b.dataset.v;
      $$('.seg button', f).forEach(x => x.className = x === b ? (b.dataset.v === '1' ? 'on-ok' : 'on-ko') : ''); break; }
    case 'save-ini': saveInicio(); break;
    case 'corr-ini': draft.editInicio[b.dataset.id] = true; renderInicio(); break;
    case 'rep-veh': draft.repVeh = b.dataset.id;
      $$('#tab-repostaje .chip').forEach(c => c.classList.toggle('on', c === b));
      { const ref = kmRef(b.dataset.id); $('#r-km').placeholder = ref != null ? 'Último: ' + fKm(ref) : 'Km'; } break;
    case 'save-rep': saveRepostaje(); break;
    case 'close': closeGuardia(); break;
    case 'share-cur': shareTxt(`Parte_${S.guardia.id}.txt`, buildTxt(S.guardia)); break;
    case 'share-hist': { const g = S.historial[+b.dataset.i]; shareTxt(`Parte_${g.id}.txt`, buildTxt(g)); break; }
    case 'discard':
      if(confirm('Se borrará del móvil la guardia en curso. Lo ya enviado a Google Sheets se mantiene. ¿Continuar?')){
        S.guardia = null; draft.editInicio = {}; persist(); renderAll(); toast('Guardia descartada'); } break;
    case 'mas-tab': draft.masTab = b.dataset.t; renderMas(); break;
    case 'add-veh': {
      const nom = $('#v-nom').value.trim().toUpperCase(), mat = $('#v-mat').value.trim().toUpperCase().replace(/\s/g, '');
      if(!nom){ $('#v-nom').classList.add('invalid'); toast('Pon el indicativo del vehículo', 'ko'); return; }
      S.config.vehiculos.push({ id:uid(), nombre:nom, matricula:mat }); persist(); renderAll(); toast(`${nom} añadido`, 'ok'); break; }
    case 'del-veh': { const v = veh(b.dataset.id);
      if(confirm(`¿Eliminar ${v.nombre} de la lista?` + (S.guardia && S.guardia.inicio[v.id] ? '\nSus registros de la guardia en curso se conservan.' : ''))){
        S.config.vehiculos = S.config.vehiculos.filter(x => x.id !== v.id); persist(); renderAll(); } break; }
    case 'save-cfg': saveCfg(); break;
    case 'test': testConn(); break;
    case 'sync': sync(true); break;
    case 'add-up': { const t = $('#up-txt').value.trim(); if(!t) return;
      UP.unshift({ text:t, ts:Date.now() }); store(UKEY, UP); renderMas(); toast('Idea guardada', 'ok'); break; }
    case 'del-up': UP.splice(+b.dataset.i, 1); store(UKEY, UP); renderMas(); break;
    case 'export-up': {
      const txt = ['PARTE DE GUARDIA · Upgrades', 'Versión: ' + VERSION, 'Exportado: ' + ahora(), '',
        '=== PROMPT ORIGINAL ===', PROMPT_ORIGINAL, '', `=== UPGRADES (${UP.length}) ===`,
        ...(UP.length ? UP.map((u, i) => `${i + 1}. [${new Date(u.ts).toLocaleDateString('es-ES')}] ${u.text}`) : ['(ninguno)'])].join('\n');
      shareTxt(`ParteGuardia_upgrades_${hoyISO()}.txt`, txt); break; }
  }
});
document.addEventListener('input', e => {
  if(e.target.classList.contains('invalid')) e.target.classList.remove('invalid');
  const f = e.target.closest('.fin-form'); if(f) updateRec(f);
});
window.addEventListener('online', () => sync());
window.addEventListener('offline', renderStatus);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') sync(); });
setInterval(() => { if(S.cola.length) sync(); }, 60000);

renderAll();
if(!S.config.vehiculos.length){ draft.masTab = 'ajustes'; renderMas(); }
else if(S.guardia && Object.keys(S.guardia.inicio).length) go('repostaje');
sync();
</script>
</body>
